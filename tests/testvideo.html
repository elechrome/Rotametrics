<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검증용 회전 영상 생성기</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e8ecf3;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
  canvas { border-radius: 8px; }
  button { font: inherit; padding: 12px 24px; border-radius: 10px; border: 1px solid #38bdf8;
           background: #0e7490; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  label { font-size: 14px; }
  input { width: 70px; font: inherit; padding: 4px; }
  p { font-size: 13px; color: #9aa5b5; max-width: 480px; line-height: 1.6; }
</style>
</head>
<body>
<h2>검증용 회전 영상 생성기</h2>
<p>지정한 각속도로 회전하는 바늘 영상을 만들어 내려받습니다.
이 파일을 Rotametrics에 불러와 측정값이 설정값과 일치하는지 확인하세요.
(각도는 실제 경과 시간 기준으로 계산되므로 프레임 드랍과 무관하게 정확합니다)</p>
<div>
  <label>각속도 <input id="omega" type="number" value="45"> deg/s</label>
  <label style="margin-left:12px">길이 <input id="dur" type="number" value="6"> s</label>
</div>
<canvas id="cv" width="480" height="480"></canvas>
<button id="btn">녹화 시작</button>
<p id="status"></p>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const btn = document.getElementById('btn');
const status = document.getElementById('status');

function draw(angleDeg) {
  const W = cv.width, cx = W / 2, cy = W / 2, R = W * 0.4;
  ctx.fillStyle = '#1a1f2b';
  ctx.fillRect(0, 0, W, W);
  // 기준 눈금 (30° 간격)
  ctx.strokeStyle = '#3a4356';
  ctx.lineWidth = 2;
  for (let a = 0; a < 360; a += 30) {
    const r = a % 90 === 0 ? R + 18 : R + 8;
    ctx.beginPath();
    ctx.moveTo(cx + R * Math.cos(a * Math.PI / 180), cy + R * Math.sin(a * Math.PI / 180));
    ctx.lineTo(cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180));
    ctx.stroke();
  }
  // 회전 바늘
  const rad = angleDeg * Math.PI / 180;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + R * Math.cos(rad), cy + R * Math.sin(rad));
  ctx.stroke();
  // 바늘 끝점 + 중심
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(cx + R * Math.cos(rad), cy + R * Math.sin(rad), 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fill();
}
draw(0);

btn.addEventListener('click', () => {
  const omega = parseFloat(document.getElementById('omega').value) || 45;
  const dur = parseFloat(document.getElementById('dur').value) || 6;
  const stream = cv.captureStream(30);
  const mime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm']
    .find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rotate_${omega}degps.${ext}`;
    a.click();
    status.textContent = `완료 — rotate_${omega}degps.${ext} 저장됨. 실제 시간 기준 ${omega} deg/s.`;
    btn.disabled = false;
  };

  btn.disabled = true;
  status.textContent = `녹화 중… (${dur}초)`;
  rec.start();
  const t0 = performance.now();
  (function tick() {
    const t = (performance.now() - t0) / 1000;
    draw(omega * t); // 실제 경과 시간 기준 각도 → 프레임 드랍과 무관
    if (t < dur) requestAnimationFrame(tick);
    else rec.stop();
  })();
});
</script>
</body>
</html>
